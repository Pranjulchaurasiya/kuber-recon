[project]
name = "kuber-recon"
version = "1.0.0"
description = "Autonomous AI Finance Controller & Settlement Verification Engine (Razorpay AI Buildathon Track 04)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KuberRecon Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.18",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "vulture>=2.11",
    "bandit>=1.7.8",
    "semgrep>=1.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/kuber_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:deepeval -p no:langsmith"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

