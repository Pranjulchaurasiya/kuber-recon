[project]
name = "kuber-recon"
version = "1.0.0"
description = "Paise-Exact Multi-Source Settlement Lineage, GSTR-2B Tax Reconciliation & Honest Refusal Engine (Razorpay AI Buildathon Track 04)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "KuberRecon Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.18",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "vulture>=2.11",
    "bandit>=1.7.8",
    "semgrep>=1.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
